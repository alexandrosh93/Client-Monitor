<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ERP Workspace Harness</title>
  <link rel="stylesheet" href="../erp-discovery.css">
  <style>
    :root{--surface:#fff;--surface2:#f3f5f9;--border:#e5e7eb;--border-md:#cbd5e1;--accent:#1e3a6e;--text:#172033;--text-2:#526078;--text-3:#8792a5;--shadow-sm:0 2px 8px rgba(15,23,42,.06)}
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:Arial,sans-serif;color:var(--text)}main{padding:18px;max-width:1500px;margin:auto}
  </style>
</head>
<body>
<main><div id="client-workspace"></div></main>
<script>
  const sampleDocument={
    answers:{'company.1':'Professional services and retail operations.'},
    checks:{'training.1':true},
    notes:{'migration.1':'Customer master file supplied.'},
    users:[{id:'u1',name:'Demo User',position:'Accounts'},{id:'u2',name:'Stock User',position:'Warehouse'}],
    trainingRoles:[{role:'Accounts Team',tasks:'Daily invoicing and receipts',level:'2 - Basic User',training:'Sales and accounting workflow',superUser:'Yes'}],
    requirements:[{id:'R01',topic:'Confirm invoice layout',type:'Setup',priority:'High',owner:'Consultant',status:'Open',date:'2026-10-15',phase:'During Implementation'}],
    migrationExtra:{history:'2-3 years',source:'Existing ERP export',freeze:'2026-11-01'},
    moduleData:{'maintenance.1':{checked:true,status:'Completed',note:'Configured',action:'Client approval',date:'2026-10-12',phase:'During Implementation',users:['u1']}},
    trainingStages:{'training.1':{status:'Completed',plannedDate:'2026-10-10',completedDate:'2026-10-10',trainer:'Consultant',participants:'Accounts Team',notes:'Completed successfully',nextAction:''},'training.2':{status:'In progress',plannedDate:'2026-10-16',completedDate:'',trainer:'Consultant',participants:'Accounts Team',notes:'Repeat customer credit limits',nextAction:'Arrange second session'}},
    changeHistory:[{date:'2026-10-12',phase:'During Implementation',consultant:'Consultant',progress:18}],fieldChanges:{}
  };
  let sampleProject=new URLSearchParams(location.search).has('empty') ? null : {id:'p1',client_id:1,name:'Demo Client Ltd ERP Project',consultant:'Consultant',phase:'During Implementation',version:'1.0',document:sampleDocument,updated_at:'2026-10-13T06:00:00Z'};
  function fakeTable(table){
    let operation='read',payload=null;
    const result=()=>operation==='update' ? ({data:[sampleProject={...sampleProject,...payload}],error:null}) : operation==='insert' && table==='client_projects' ? ({data:sampleProject={id:'auto-project',updated_at:new Date().toISOString(),...payload},error:null}) : operation==='insert' ? ({data:null,error:null}) : ({data:sampleProject?[sampleProject]:[],error:null});
    const chain={select(){return chain},eq(){return chain},order(){return Promise.resolve(result())},update(value){operation='update';payload=value;return chain},insert(value){operation='insert';payload=value;return chain},single(){return Promise.resolve(result())},then(resolve,reject){return Promise.resolve(result()).then(resolve,reject)}};
    return chain;
  }
  window.clientMonitorApi={getSupabase:()=>({from:fakeTable}),getClients:()=>[{id:1,name:'Demo Client Ltd',contact:'Maria Demo',email:'client@example.com',city:'Limassol',implementor:'Consultant',status:'Active',modules:['Accounting','Stock'],progress:65,liveDate:'2026-11-15'}],getCurrentUser:()=> 'tester',goClients:()=>{},goToClient:()=>{},toast:message=>console.log(message),audit:()=>{}};
</script>
<script type="module">
  await import('../erp-discovery.js');
  await window.openClientWorkspace(1);
</script>
</body>
</html>
